# ????????????????????????????????????????????????????????????????????????????
# CashFlow Web ? Spring Boot Configuration
# ????????????????????????????????????????????????????????????????????????????

# ?? Server ??????????????????????????????????????????????????????????????????
server.port=${PORT:8080}

# HTTP/2 aktif (Tomcat mendukung h2c di belakang proxy, atau h2 dengan SSL)
server.http2.enabled=true

# Compression (berguna untuk static assets frontend)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# SSL ? aktifkan untuk HTTP/2 penuh tanpa reverse proxy
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=changeit
# server.ssl.key-store-type=PKCS12

# ?? Database H2 ??????????????????????????????????????????????????????????????
spring.datasource.url=jdbc:h2:mem:cashflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Connection pool (HikariCP default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ?? JPA / Hibernate ??????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ?? JWT ??????????????????????????????????????????????????????????????????????
jwt.secret=cashflow_super_secret_key_minimal_32_chars_ok
# 24 jam dalam milidetik
jwt.expiration=86400000

# ?? Static Resources & SPA Routing ??????????????????????????????????????????
# Spring Boot otomatis serve file dari classpath:/static/
# SpaController menangani fallback ke index.html untuk React Router
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=604800

# ?? Logging ??????????????????????????????????????????????????????????????????
logging.level.cashflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
